#  can_tools.tmpfiles.conf - creates the runtime/state directories can_tools
#  needs (lock file, watchdog pause marker, rebind-count state, crash dumps).
#  Installed by install.sh to /etc/tmpfiles.d/can_tools.conf (see Issue #9
#  §4-5). /run/can_tools is also created directly by install.sh so it exists
#  immediately after install, without waiting for the next boot or a manual
#  `systemd-tmpfiles --create`.
#
# Type Path               Mode UID  GID  Age Argument
d      /run/can_tools      0755 root root -
d      /var/lib/can_tools  0755 root root -
